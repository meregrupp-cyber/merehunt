name: Deploy

# Kaks faasi:
#   production — Worker võtab custom domain'id merehunt.ee ja www.merehunt.ee ning HTTPS
#                lülitatakse tsoonis sisse (vaikimisi). Eeldab, et vanad GitHub Pages'i
#                DNS-kirjed on Cloudflare'i DNS-vaates kustutatud.
#   preview    — Worker läheb ainult workers.dev alla, merehunt.ee jääb puutumata.
#
# Faasi saab valida käsitsi käivitades või püsivalt repo muutujaga DEPLOY_PHASE.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      phase:
        description: Deploy faas
        type: choice
        required: true
        default: production
        options:
          - production
          - preview

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.phase || vars.DEPLOY_PHASE || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PHASE: ${{ github.event.inputs.phase || vars.DEPLOY_PHASE || 'production' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN puudub. Lisa see Settings → Secrets and variables → Actions."
            exit 1
          fi

      - run: npm ci
      - run: npm test

      - name: Dry run
        run: |
          if [ "$PHASE" = "production" ]; then npm run deploy:production:dry; else npm run deploy:dry; fi

      - name: Deploy preview
        if: env.PHASE != 'production'
        run: npm run deploy | tee deploy.log

      - name: Verify preview host
        if: env.PHASE != 'production'
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then
            echo "::warning::workers.dev URL-i ei leitud deploy väljundist, jätan kontrolli vahele."
            exit 0
          fi
          echo "Preview: $URL"
          node tools/verify-live.mjs --base="$URL"

      - name: Deploy production
        if: env.PHASE == 'production'
        run: npm run deploy:production

      - name: Enable zone HTTPS
        if: env.PHASE == 'production'
        run: node tools/cloudflare-https.mjs

      - name: Verify live HTTPS delivery
        if: env.PHASE == 'production'
        run: node tools/verify-live.mjs
